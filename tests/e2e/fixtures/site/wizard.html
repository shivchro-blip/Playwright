<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AutomateNY wizard page</title>
<style>.screen{display:none}.screen.on{display:block}button[aria-pressed=true]{outline:2px solid #2563eb}</style></head>
<body>
  <h1>Application wizard</h1>
  <section class="screen on" id="s1">
    <div data-attribute-id="LSI_DEMO_BusName"><label>Business name <input></label></div>
    <div data-attribute-id="LSI_DEMO_HomeBased"><button type="button">Yes</button><button type="button">No</button></div>
    <button type="button" data-next="s2">Save &amp; Continue</button>
  </section>
  <section class="screen" id="s2">
    <div data-attribute-id="LSI_DEMO_Zip"><label>Zip <input></label></div>
    <div data-attribute-id="LSI_DEMO_Taxed"><button type="button">Yes</button><button type="button">No</button></div>
    <button type="button" data-next="s3">Save &amp; Continue</button>
  </section>
  <section class="screen" id="s3">
    <p id="done">Ready to submit</p>
    <button type="button" data-next="s4">Submit Application</button>
  </section>
  <section class="screen" id="s4"><p id="thanks">Application received</p></section>
  <script>
    document.querySelectorAll('[data-attribute-id] button').forEach(b => b.addEventListener('click', () => {
      b.parentElement.querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', o === b));
    }));
    document.querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', () => {
      b.closest('.screen').classList.remove('on');
      document.getElementById(b.dataset.next).classList.add('on');
    }));
  </script>
</body>
</html>
