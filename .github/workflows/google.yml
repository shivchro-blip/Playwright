# Runs the GOOGLE sample tests against the live sites (google.com, about.google).
# Informational, not a required check: the result depends on Google (consent pages, captchas, outages).
name: Google sample (live site)

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"  # Mondays 05:37 UTC

permissions:
  contents: read

jobs:
  google:
    name: GOOGLE / dev / chrome
    runs-on: windows-latest  # Google Chrome is preinstalled on GitHub's Windows runners
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Run the GOOGLE tests
        env:
          systemConfig: GOOGLE
          envConfig: dev
          runTags: GOOGLE
          browsers: chrome
          headlessMode: "true"
          PYTHONUTF8: "1"
        run: python -m pytest tests/dynamic_test_suite.py -v -o addopts= -p no:cacheprovider --alluredir=allure-results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-results
          path: |
            allure-results
            workspace/logs
          retention-days: 14
          if-no-files-found: ignore
